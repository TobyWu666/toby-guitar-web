<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toby 吉他課堂筆記 · 風格提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ───────────── Studio chrome (not part of the design) ───────────── */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#D9D7D2;color:#222}
.controls{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 16px;background:#1d1d1f;color:#eee}
.ctl{display:flex;align-items:center;gap:8px}
.ctl-label{font-size:12px;color:#9a9a9f}
.seg{display:inline-flex;background:#333336;border-radius:8px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:6px;font-size:13px;color:#c9c9cc;white-space:nowrap}
.seg button.on{background:#fff;color:#111}
.style-note{flex-basis:100%;font-size:12.5px;line-height:1.6;color:#b5b5ba;margin:0}
.style-note b{color:#fff;font-weight:600}
.stage{padding:16px;display:flex;justify-content:center}

/* ───────────── The mock site frame ───────────── */
.frame{position:relative;width:100%;max-width:1280px;height:calc(100vh - var(--ctrl-h,100px) - 32px);min-height:520px;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.2);container-type:inline-size;container-name:site}
.frame[data-device="mobile"]{max-width:390px;height:min(844px,calc(100vh - var(--ctrl-h,100px) - 32px));border-radius:34px;outline:10px solid #111}
.scroller{height:100%;overflow:auto;background-color:var(--bg);color:var(--text);font-family:var(--font-body);scroll-behavior:smooth}

/* ── Tokens: A 紙本筆記 ── */
.frame[data-style="a"]{--font-head:"Noto Serif TC",serif;--font-body:"Noto Sans TC",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--head-weight:700;--head-tracking:0;--radius:4px;--radius-lg:8px;--hand:8px}
.frame[data-style="a"][data-mode="light"]{--bg:#F5F0E6;--surface:#FBF8F1;--surface-2:#ECE4D4;--text:#26211C;--text-2:#4A423A;--muted:#857A6D;--line:#E0D6C5;--line-strong:#C9BBA5;--accent:#A8452A;--accent-ink:#FFF8F0;--accent-soft:#F2E0D3;--cat-theory:#3D5A8C;--cat-fret:#4D7A4A;--cat-tech:#A8452A;--cat-rhythm:#A87A1E;--shadow:none}
.frame[data-style="a"][data-mode="dark"]{--bg:#1B1815;--surface:#23201B;--surface-2:#2E2A24;--text:#EFE8DC;--text-2:#CFC6B8;--muted:#968B7D;--line:#39332C;--line-strong:#51493F;--accent:#E07D5A;--accent-ink:#1B1310;--accent-soft:#3A261E;--cat-theory:#8FA9DA;--cat-fret:#94BE8E;--cat-tech:#E58E6E;--cat-rhythm:#D9B061;--shadow:none}
/* ── Tokens: B 白板 ── */
.frame[data-style="b"]{--font-head:"Huninn","Noto Sans TC",sans-serif;--font-body:"Noto Sans TC",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--head-weight:400;--head-tracking:.01em;--radius:12px;--radius-lg:18px;--hand:16px 20px 14px 22px / 20px 14px 22px 16px}
.frame[data-style="b"][data-mode="light"]{--bg:#F7F8F5;--surface:#FFFFFF;--surface-2:#ECEEE9;--text:#1C1F24;--text-2:#3D424A;--muted:#6B717A;--line:#DDE0DA;--line-strong:#B9BEB6;--accent:#1F5FD1;--accent-ink:#FFFFFF;--accent-soft:#E3ECFB;--cat-theory:#1F5FD1;--cat-fret:#17894A;--cat-tech:#D2392C;--cat-rhythm:#E07A10;--shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px -10px rgba(20,30,40,.18)}
.frame[data-style="b"][data-mode="dark"]{--bg:#1E2622;--surface:#253029;--surface-2:#2E3A33;--text:#EEF1EA;--text-2:#CBD3C8;--muted:#8E9A90;--line:#35423A;--line-strong:#4B5B51;--accent:#7EB0FF;--accent-ink:#0E1A2E;--accent-soft:#223449;--cat-theory:#7EB0FF;--cat-fret:#6FD39A;--cat-tech:#FF8A7A;--cat-rhythm:#FFB65C;--shadow:none}
/* ── Tokens: C 夜間指板 ── */
.frame[data-style="c"]{--font-head:"Noto Sans TC",system-ui,sans-serif;--font-body:"Noto Sans TC",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--head-weight:900;--head-tracking:-.02em;--radius:3px;--radius-lg:6px;--hand:6px}
.frame[data-style="c"][data-mode="dark"]{--bg:#131110;--surface:#1B1816;--surface-2:#26221E;--text:#F0E9DD;--text-2:#CDC4B6;--muted:#8F867A;--line:#2C2824;--line-strong:#45403A;--accent:#D9A441;--accent-ink:#1A1206;--accent-soft:#2E2515;--cat-theory:#86A9DB;--cat-fret:#8FC28C;--cat-tech:#E27E63;--cat-rhythm:#D9A441;--shadow:none}
.frame[data-style="c"][data-mode="light"]{--bg:#F2EEE7;--surface:#FFFFFF;--surface-2:#E7E1D6;--text:#161310;--text-2:#3C352E;--muted:#7D7468;--line:#DDD5C8;--line-strong:#BFB4A3;--accent:#9C6A10;--accent-ink:#FFFFFF;--accent-soft:#F1E5CC;--cat-theory:#2F5A99;--cat-fret:#3D7A3A;--cat-tech:#B4472E;--cat-rhythm:#9C6A10;--shadow:none}

/* ───────────── Site base ───────────── */
.site{min-height:100%;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.site main{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4cqi,40px)}
.site h1,.site h2,.site h3{font-family:var(--font-head);font-weight:var(--head-weight);letter-spacing:var(--head-tracking);color:var(--text)}
.site h1{font-size:clamp(30px,5cqi,50px);line-height:1.22;margin:0 0 16px;text-wrap:balance}
.site h2{font-size:clamp(22px,2.8cqi,28px);line-height:1.3;margin:0}
.site button{font:inherit;color:inherit}
.site a{cursor:pointer}
.kicker{font-size:13.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 12px}
.lede{font-size:18px;line-height:1.7;color:var(--text-2);max-width:34em;margin:0 0 20px}
.mark{position:relative}

/* Logo */
.logo{display:block;color:var(--text);overflow:visible}
.logo-sm{height:42px;width:auto}
.logo.draw path{stroke-dasharray:1 2;stroke-dashoffset:1.01}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.logo.draw path{animation:none!important;stroke-dashoffset:0}}

/* Header */
.hdr{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
.brand-sub{font-family:var(--font-head);font-weight:var(--head-weight);font-size:15px;letter-spacing:.04em;padding-left:12px;border-left:1px solid var(--line-strong);white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:6px 12px;border-radius:var(--radius);color:var(--muted);font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--text);background:var(--surface-2)}
.search-btn{display:flex;align-items:center;gap:8px;padding:7px 9px 7px 11px;border:1px solid var(--line);background:var(--surface);color:var(--muted)!important;border-radius:var(--radius);font-size:14px!important;cursor:pointer;white-space:nowrap}
.search-btn svg{width:16px;height:16px}
kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
@container site (max-width:720px){
  .brand-sub{display:none}
  .hdr-in{gap:6px;height:60px}
  .logo-sm{height:36px}
  .nav a{padding:6px 9px;font-size:14.5px}
  .search-btn{padding:8px}
  .search-btn span,.search-btn kbd{display:none}
}

/* Chips & buttons */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;font-size:13px!important;line-height:1;padding:6px 10px;border-radius:999px;color:color-mix(in srgb,var(--c) 80%,var(--text))!important;background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);cursor:pointer;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
[data-cat="theory"]{--c:var(--cat-theory)}
[data-cat="fret"]{--c:var(--cat-fret)}
[data-cat="tech"]{--c:var(--cat-tech)}
[data-cat="rhythm"]{--c:var(--cat-rhythm)}
.btn{font-size:15px!important;padding:10px 18px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)!important}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--text)!important}
.actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.link{color:var(--accent);font-size:14.5px;white-space:nowrap;text-decoration:none}

/* Card & checklist */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow)}
.card-label{font-size:12.5px;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.55;font-size:15px;color:var(--text)}
.checklist input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:3px 0 0;border:1.5px solid var(--line-strong);border-radius:4px;display:grid;place-content:center;cursor:pointer;background:var(--bg)}
.checklist input:checked{background:var(--accent);border-color:var(--accent)}
.checklist input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.checklist input:checked+span{color:var(--muted);text-decoration:line-through}
.next{margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line-strong);font-size:14px;color:var(--muted)}
.next b{color:var(--text);font-weight:600}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:48px;padding-block:60px 44px;align-items:start}
.neck{grid-column:1/-1}
@container site (max-width:760px){.hero{grid-template-columns:1fr;gap:26px;padding-block:32px 28px}.lede{font-size:16.5px}}

/* Sections */
.sec{padding-block:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.sec-meta{color:var(--muted);font-size:14px;margin:0;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.filter{font-size:14px!important;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)!important;cursor:pointer}
.filter.on{background:var(--text);color:var(--bg)!important;border-color:var(--text)}
.month{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:26px 0 8px;font-weight:700}
.more{display:block;margin:22px auto 0;background:none;border:1px dashed var(--line-strong);color:var(--muted)!important;padding:10px 18px;border-radius:var(--radius);font-size:14px!important;cursor:pointer}

/* Lesson list */
.lesson-list{list-style:none;margin:0;padding:0}
.lesson-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid var(--line);cursor:pointer}
.lesson-item:hover h3{color:var(--accent)}
.li-no{font-family:var(--font-head);font-size:36px;line-height:1;color:var(--accent);font-weight:var(--head-weight);white-space:nowrap}
.li-meta{font-size:13px;color:var(--muted)}
.lesson-item h3{font-size:20px;margin:2px 0 4px;line-height:1.4;transition:color .15s}
.lesson-item p{margin:0 0 12px;color:var(--text-2);font-size:15px;line-height:1.65}
@container site (max-width:720px){.lesson-item{grid-template-columns:54px minmax(0,1fr);gap:12px}.li-no{font-size:26px}.lesson-item h3{font-size:18px}}

/* Category tiles */
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@container site (max-width:760px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat-tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--radius-lg);padding:16px;cursor:pointer;display:grid;gap:4px;box-shadow:var(--shadow)}
.cat-tile b{font-family:var(--font-head);font-size:20px;font-weight:var(--head-weight);color:var(--c)}
.cat-tile span{font-size:13px;color:var(--muted)}
.cat-tile small{font-size:13.5px;color:var(--text-2);line-height:1.55}

/* Footer */
.ftr{border-top:1px solid var(--line);margin-top:48px;padding-block:28px 40px;color:var(--muted);font-size:13.5px}
.ftr-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ftr .logo{height:32px;color:var(--muted)}

/* ───────────── Lesson page ───────────── */
.crumbs{font-size:14px;color:var(--muted);padding-top:28px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.lesson-head{padding-block:14px 30px;border-bottom:1px solid var(--line)}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:64px}
@container site (max-width:960px){.lesson-grid{grid-template-columns:1fr}.toc{display:none}}
.prose{max-width:720px;min-width:0}
.prose section{padding-top:36px;scroll-margin-top:84px}
.prose h2{margin-bottom:14px}
.prose p,.prose li{color:var(--text-2)}
.prose ul{padding-left:1.25em;margin:0}
.prose li{margin:4px 0}
.prose strong{color:var(--text)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin:18px 0 0;color:var(--text)}
.toc{position:sticky;top:90px;align-self:start;padding-top:40px;font-size:14px}
.toc p{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
.toc ol{list-style:none;margin:0 0 28px;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:4px 0 4px 14px;color:var(--muted);margin-left:-1px;border-left:2px solid transparent;text-decoration:none;line-height:1.5}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--text);border-left-color:var(--accent)}
.toc-m{display:none}
@container site (max-width:960px){
  .toc-m{display:flex;gap:6px;overflow-x:auto;position:sticky;top:66px;z-index:5;background:var(--bg);padding:10px clamp(16px,4cqi,40px);margin-inline:calc(-1 * clamp(16px,4cqi,40px));border-bottom:1px solid var(--line);scrollbar-width:none}
  .toc-m a{flex:none;font-size:13.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
  .toc-m a.on{background:var(--text);color:var(--bg);border-color:var(--text)}
}
@container site (max-width:720px){.toc-m{top:60px}}

/* Figures / components */
.figure{margin:18px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow)}
.fig-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fig-title{font-weight:700;font-size:15px;color:var(--text)}
.fig-cap{font-size:13px;color:var(--muted);margin:10px 0 0}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.toggle button{font-size:13px!important;border:0;background:none;color:var(--muted)!important;padding:4px 12px;border-radius:999px;cursor:pointer}
.toggle button.on{background:var(--text);color:var(--bg)!important}

.fb{display:block;width:100%;height:auto;margin:auto}
.fb-h .fb{max-width:600px}
.fb-v{display:none}
.fb-v .fb{max-width:270px}
@container site (max-width:600px){.fb-h{display:none}.fb-v{display:block}}
.fb .str{stroke:var(--muted)}
.fb .fret{stroke:var(--line-strong);stroke-width:2}
.fb .nut{fill:var(--text-2)}
.fb .inlay{fill:var(--line-strong);opacity:.7}
.fb .lbl{fill:var(--muted);font:500 12px var(--font-mono)}
.fb .note circle{fill:var(--text)}
.fb .note text{fill:var(--bg);font:700 13px var(--font-body);text-anchor:middle;dominant-baseline:central}
.fb .note.root circle{fill:var(--accent)}
.fb .note.root text{fill:var(--accent-ink)}
.fb .title{fill:var(--text);font:700 16px var(--font-body);text-anchor:middle}
[data-label="name"] .fb .t-iv{display:none}
[data-label="iv"] .fb .t-name{display:none}

.tab{font-family:var(--font-mono);font-size:14px;line-height:1.55;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;margin:0;white-space:pre}
.tab em{font-style:normal;color:var(--text);font-weight:600}
.tab .sn{color:var(--accent)}
.audio{display:flex;align-items:center;gap:12px;margin-top:14px}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink)!important;display:grid;place-content:center;cursor:pointer}
.play svg{width:14px;height:14px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:36px;position:relative;min-width:0}
.wave i{flex:1;background:var(--line-strong);border-radius:2px;min-width:1px}
.wave::after{content:"";position:absolute;inset:0 auto 0 0;width:0;background:color-mix(in srgb,var(--accent) 30%,transparent);mix-blend-mode:normal;border-radius:2px}
.audio.playing .wave::after{animation:prog 12s linear forwards}
@keyframes prog{to{width:100%}}
.time{font:500 12.5px var(--font-mono);color:var(--muted)}

.chord-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center}
@container site (max-width:560px){.chord-row{grid-template-columns:120px minmax(0,1fr);gap:14px}}
.chord-row p{margin:0}

.board{display:block;width:100%;height:auto;border-radius:var(--radius);cursor:zoom-in}

.exercise{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;background:var(--surface)}
.ex-label{font:700 12.5px var(--font-body);letter-spacing:.08em;color:var(--accent);margin:0 0 6px}
.exercise>p{margin:0 0 10px;color:var(--text)!important}
.exercise details{border-top:1px dashed var(--line-strong);padding-top:10px}
.exercise summary{cursor:pointer;color:var(--accent);font-size:14.5px;list-style:none}
.exercise summary::-webkit-details-marker{display:none}
.exercise summary::before{content:"▸ "}
.exercise details[open] summary::before{content:"▾ "}
.exercise details p{margin:8px 0 0}

.qa{margin:0}
.qa dt{font-weight:700;color:var(--text);margin-top:14px}
.qa dt::before{content:"Q　";color:var(--accent)}
.qa dd{margin:4px 0 0;color:var(--text-2);padding-left:2em}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pager a,.pager span{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:var(--text);font-size:15px;line-height:1.5}
.pager small{display:block;color:var(--muted);font-size:12.5px}
.pager a:hover{border-color:var(--accent)}
.pager span{color:var(--muted);text-align:right;border-style:dashed}
.side-topics{display:grid;gap:8px;justify-items:start}

/* ───────────── Knowledge map ───────────── */
.map-head{padding-block:40px 24px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend .up i{background:none;border:1.5px dashed var(--muted)}
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@container site (max-width:960px){.map-wrap{grid-template-columns:1fr}}

.map-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

.map-lines path.e.hl{stroke:var(--accent);stroke-width:2.5}
.map-lines .ah{fill:var(--line-strong)}
.map-lines .ah.hl{fill:var(--accent)}
.lv{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
@container site (max-width:720px){.lv{flex-direction:row;flex-wrap:wrap}.lv .lv-name{flex-basis:100%}.node{flex:1 1 40%}}
.lv-name{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.node{text-align:left;background:var(--bg);border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--line));border-left:4px solid var(--c);border-radius:var(--radius);padding:10px 12px;cursor:pointer;line-height:1.4}
.node b{display:block;font-size:15.5px;color:var(--text);font-weight:700}
.node span{font-size:12.5px;color:var(--muted)}
.node:hover{border-color:var(--c)}
.node.on{outline:2.5px solid var(--c);outline-offset:2px}

.node.upcoming b{color:var(--muted)}
.topic-panel{position:sticky;top:90px}
.topic-panel h3{font-size:26px;margin:10px 0 6px}
.topic-panel>p{margin:0 0 6px;color:var(--text-2);font-size:15px}
.tp-label{font-size:12px!important;letter-spacing:.08em;color:var(--muted)!important;font-weight:700;margin:18px 0 8px!important}

.tp-lessons a{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--text);font-size:14.5px;line-height:1.45}
.tp-lessons a small{display:block;color:var(--muted);font-size:12.5px}
.tp-lessons a:hover{border-color:var(--accent)}
.tp-none{font-size:14px;color:var(--muted)}

.search{position:absolute;inset:0;z-index:40;background:rgba(10,10,10,.42);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;backdrop-filter:blur(2px)}
.search-box{width:min(620px,100%);background:var(--surface);color:var(--text);font-family:var(--font-body);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}
.search-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}

.search-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:16px 0}
.results{max-height:52vh;overflow:auto;padding:8px}
.res-head{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--radius);padding:10px;cursor:pointer;color:var(--text);font:inherit}

.res small{display:block;color:var(--muted);font-size:13px;line-height:1.5}

.search-foot{border-top:1px solid var(--line);padding:9px 16px;font-size:12.5px;color:var(--muted)}

function fbH(from, to, notes, label) {
  const n = to - from + 1, C = 72, X0 = 34, Y0 = 20, G = 30, W = X0 + n * C + 14, H = Y0 + 5 * G + 34;

  for (let k = 0; k <= n; k++) s += `<line class="fret" x1="${X0 + k * C}" y1="${Y0}" x2="${X0 + k * C}" y2="${Y0 + 5 * G}"/>`;

}
function fbV(from, to, notes, label) {

  const names = ["E", "A", "D", "G", "B", "e"];

  let s = `<svg class="fb" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  for (let f = from; f <= to; f++) if (INLAYS.includes(f)) s += `<circle class="inlay" cx="${X0 + 2.5 * G}" cy="${Y0 + (f - from + .5) * C}" r="6"/>`;
  for (let k = 0; k <= n; k++) s += `<line class="fret" x1="${X0}" y1="${Y0 + k * C}" x2="${X0 + 5 * G}" y2="${Y0 + k * C}"/>`;
  names.forEach((nm, i) => {

function chordSvg() { // Am7 x02010
  const X0 = 30, Y0 = 50, G = 20, C = 26, W = X0 + 5 * G + 20, H = Y0 + 4 * C + 30;
  const open = ["×", "○", "", "○", "", "○"], bottom = ["", "A", "E", "G", "C", "E"];
  let s = `<svg class="fb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Am7 和弦按法 x02010"><text class="title" x="${X0 + 2.5 * G}" y="18">Am7</text>`;
  s += `<rect class="nut" x="${X0 - 1}" y="${Y0 - 4}" width="${5 * G + 2}" height="5"/>`;
  for (let k = 1; k <= 4; k++) s += `<line class="fret" x1="${X0}" y1="${Y0 + k * C}" x2="${X0 + 5 * G}" y2="${Y0 + k * C}"/>`;
  for (let i = 0; i < 6; i++) {

    s += `<line class="str" x1="${x}" y1="${Y0}" x2="${x}" y2="${Y0 + 4 * C}" stroke-width="${1 + (5 - i) * .3}"/>`;
    s += `<text class="lbl" x="${x}" y="${Y0 - 14}" text-anchor="middle">${open[i]}</text>`;
    s += `<text class="lbl" x="${x}" y="${H - 6}" text-anchor="middle">${bottom[i]}</text>`;
  }
  s += noteG(X0 + 2 * G, Y0 + 1.5 * C, {n:"2", i:"2"}, 9) + noteG(X0 + 4 * G, Y0 + .5 * C, {n:"1", i:"1"}, 9);

}
function tabBlock() {
  const order = [[6,5],[6,8],[5,5],[5,7],[4,5],[4,7],[3,5],[3,7],[2,5],[2,8],[1,5],[1,8]];

function neck() {
  const X0 = 46, XE = 986, Y0 = 40, G = 18, W = 1000, H = 164;
  const fx = k => X0 + (1 - Math.pow(2, -k / 12)) * (XE - X0) / 0.5;
  const PENTA = {1:[0,3,5,8,10,12],2:[1,3,5,8,10],3:[0,2,5,7,9,12],4:[0,2,5,7,10,12],5:[0,3,5,7,10,12],6:[0,3,5,8,10,12]};
  const ROOTS = {1:[5],2:[10],3:[2],4:[7],5:[0,12],6:[5]};
  const midY = Y0 + 2.5 * G;
  let s = `<svg class="neck-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="A 小調五聲音階在整個指板上的位置，第一指型位於第 5 到第 8 格">`;
  s += `<rect class="board" x="${X0}" y="${Y0 - 10}" width="${XE - X0}" height="${5 * G + 20}" rx="2"/>`;
  s += `<rect class="boxframe" x="${fx(4) + 3}" y="${Y0 - 16}" width="${fx(8) - fx(4) - 6}" height="${5 * G + 32}" rx="6"/>`;
  s += `<text class="bl" x="${fx(4) + 8}" y="${Y0 - 20}">第一指型</text>`;
  [3, 5, 7, 9].forEach(k => s += `<circle class="inl" cx="${(fx(k - 1) + fx(k)) / 2}" cy="${midY}" r="5"/>`);
  s += `<circle class="inl" cx="${(fx(11) + fx(12)) / 2}" cy="${Y0 + 1.5 * G}" r="5"/><circle class="inl" cx="${(fx(11) + fx(12)) / 2}" cy="${Y0 + 3.5 * G}" r="5"/>`;
  s += `<rect class="nut" x="${X0 - 3}" y="${Y0 - 10}" width="6" height="${5 * G + 20}"/>`;
  for (let k = 1; k <= 12; k++) s += `<line class="fr" x1="${fx(k)}" y1="${Y0 - 10}" x2="${fx(k)}" y2="${Y0 + 5 * G + 10}"/>`;
  for (let st = 1; st <= 6; st++) s += `<line class="st" x1="${X0 - 10}" y1="${Y0 + (st - 1) * G}" x2="${XE}" y2="${Y0 + (st - 1) * G}" stroke-width="${.8 + (st - 1) * .35}"/>`;
  for (let st = 1; st <= 6; st++) PENTA[st].forEach(f => {
    const x = f === 0 ? X0 - 22 : (fx(f - 1) + fx(f)) / 2, y = Y0 + (st - 1) * G;
    const box = f >= 5 && f <= 8, root = ROOTS[st].includes(f);
    s += `<circle class="n${box ? " box" : ""}${root ? " root" : ""}" cx="${x}" cy="${y}" r="7"/>`;
  });
  [3, 5, 7, 9, 12].forEach(k => s += `<text class="fn" x="${(fx(k - 1) + fx(k)) / 2}" y="${H - 6}">${k}</text>`);
  return s + "</svg>";
}

            <details><summary>看答案</summary><p>B 小調五聲音階。根音從 A 往上移一個全音到 B，指型不變，調就跟著移動。</p></details></div>
          <div class="exercise"><p class="ex-label">練習 2</p><p>第一指型裡，一共有幾個根音 A？分別在哪條弦、哪一格？</p>
            <details><summary>看答案</summary><p>三個：第 6 弦第 5 格、第 4 弦第 7 格、第 1 弦第 5 格。</p></details></div></section>
        <section id="homework"><h2>回家作業</h2><div class="card" style="margin-top:4px">${checklist(HOMEWORK)}</div></section>
        <section id="qa"><h2>同學的問題</h2><dl class="qa">
          <dt>五聲音階和藍調音階差在哪？</dt><dd>藍調音階是在小調五聲音階裡多加一個 ♭5（A 小調是 E♭），聽起來更「藍調」。之後會專門上一堂。</dd>
          <dt>一定要用交替撥弦嗎？</dt><dd>剛開始建議用，速度快起來之後手比較不會亂。等穩定了，再練其他撥法。</dd></dl></section>
        <nav class="pager"><a data-go="lesson"><small>← 上一堂 · 第 ${prev.no} 堂</small>${prev.title}</a><span><small>下一堂 · 第 15 堂</small>9/23 上課後更新</span></nav>
      </article>
      <aside class="toc"><p>本頁目錄</p><ol>${SECTIONS.map(([id, t]) => `<li><a data-toc="${id}">${t}</a></li>`).join("")}</ol>
        <p>相關知識點</p><div class="side-topics">${L.topics.map(chip).join("")}</div></aside>
    </div>
  </div></main>`;
}
function mapPage() {
  const sel = T[state.selTopic] || T.pentatonic;
  const levels = LV_NAMES.map((name, lv) => `<div class="lv"><p class="lv-name">${name}</p>${TOPICS.filter(t => t.lv === lv).map(t => `
    <button class="node ${t.upcoming ? "upcoming" : ""} ${t.id === sel.id ? "on" : ""}" data-cat="${t.cat}" data-pick="${t.id}" data-topic-node="${t.id}"><b>${t.name}</b><span>${t.upcoming ? "即將上到" : `${CATS[t.cat]} · ${t.lessons.length} 堂課`}</span></button>`).join("")}</div>`).join("");
  const nexts = TOPICS.filter(t => t.pre.includes(sel.id));
  const pick = id => `<button class="chip" data-cat="${T[id].cat}" data-pick="${id}">${T[id].name}</button>`;
  return `<main><div class="wrap">
    <header class="map-head"><p class="kicker">知識地圖</p><h1>從哪裡開始、<span class="mark">下一步</span>學什麼</h1>
      <p class="lede">箭頭代表「先學 → 再學」。點任何一個知識點，就能看到說明和教過的課。</p>
      <div class="legend">${Object.entries(CATS).map(([k, v]) => `<span data-cat="${k}"><i></i>${v}</span>`).join("")}<span class="up"><i></i>即將上到</span></div></header>
    <div class="map-wrap">
      <div class="map" id="map"><svg class="map-lines" aria-hidden="true"></svg>${levels}</div>
      <aside class="card topic-panel">
        <span class="chip" data-cat="${sel.cat}">${CATS[sel.cat]}</span>
        <h3>${sel.name}</h3><p>${sel.desc}</p>
        <p class="tp-label">要先懂</p>${sel.pre.length ? `<div class="chips">${sel.pre.map(pick).join("")}</div>` : `<p class="tp-none">這是起點，不需要前置知識。</p>`}
        <p class="tp-label">教過的課</p>${sel.lessons.length ? `<ul class="tp-lessons">${sel.lessons.map(no => { const l = L_BY_NO[no]; return `<li><a data-go="lesson"><small>第 ${no} 堂 · ${fmtShort(l.date)}</small>${l.title}</a></li>`; }).join("")}</ul>` : `<p class="tp-none">還沒上到，敬請期待。</p>`}
        <p class="tp-label">接下來可以學</p>${nexts.length ? `<div class="chips">${nexts.map(t => pick(t.id)).join("")}</div>` : `<p class="tp-none">—</p>`}
      </aside>
    </div>
  </div></main>`;
}

/* ───────────── Behaviour ───────────── */
function animateLogo() {
  site.querySelectorAll(".logo.draw").forEach(svg => {
    const ps = [...svg.querySelectorAll("path")];
    const lens = ps.map(p => p.getTotalLength());
    const total = lens.reduce((a, b) => a + b, 0);
    let t = .2;
    ps.forEach((p, i) => {
      const d = Math.max(.08, 1.5 * lens[i] / total);
      p.style.animation = `draw ${d.toFixed(2)}s cubic-bezier(.45,0,.4,1) ${t.toFixed(2)}s forwards`;
      t += d + .05;
    });
  });
}
function drawMap() {
  const map = site.querySelector("#map"); if (!map) return;
  const svg = map.querySelector(".map-lines");
  const mr = map.getBoundingClientRect();
  let out = "";
  TOPICS.forEach(t => t.pre.forEach(p => {
    const a = map.querySelector(`[data-topic-node="${p}"]`).getBoundingClientRect();
    const b = map.querySelector(`[data-topic-node="${t.id}"]`).getBoundingClientRect();
    const hl = state.selTopic === t.id || state.selTopic === p ? " hl" : "";
    let d, head;
    if (b.left >= a.right - 2) {
      const x1 = a.right - mr.left, y1 = a.top + a.height / 2 - mr.top, x2 = b.left - mr.left - 7, y2 = b.top + b.height / 2 - mr.top, mx = (x1 + x2) / 2;
      d = `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
      head = `M${x2} ${y2 - 5}L${x2 + 7} ${y2}L${x2} ${y2 + 5}Z`;
    } else {
      const x1 = a.left + a.width / 2 - mr.left, y1 = a.bottom - mr.top, x2 = b.left + b.width / 2 - mr.left, y2 = b.top - mr.top - 7, my = (y1 + y2) / 2;
      d = `M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}`;
      head = `M${x2 - 5} ${y2}L${x2} ${y2 + 7}L${x2 + 5} ${y2}Z`;
    }
    out += `<path class="e${hl}" d="${d}"/><path class="ah${hl}" d="${head}"/>`;
  }));
  svg.innerHTML = out;
}
let spyHandler = null;
function setupSpy() {
  if (spyHandler) scroller.removeEventListener("scroll", spyHandler);
  const links = [...site.querySelectorAll("[data-toc]")];
  if (!links.length) return;
  spyHandler = () => {
    const top = scroller.getBoundingClientRect().top;
    let cur = SECTIONS[0][0];
    site.querySelectorAll(".prose section").forEach(s => { if (s.getBoundingClientRect().top - top < 150) cur = s.id; });
    links.forEach(a => a.classList.toggle("on", a.dataset.toc === cur));
    const m = site.querySelector(".toc-m a.on");
    if (m) { const bar = m.parentElement; const r = m.offsetLeft - bar.clientWidth / 2 + m.clientWidth / 2; bar.scrollTo({left: r, behavior: "smooth"}); }
  };
  scroller.addEventListener("scroll", spyHandler, {passive: true});
  spyHandler();
}
const ro = new ResizeObserver(() => drawMap());
function render(resetScroll = false) {
  const top = scroller.scrollTop;
  Object.assign(frame.dataset, {style: state.style, mode: state.mode, device: state.device});
  document.querySelectorAll("[data-set]").forEach(b => { const [k, v] = b.dataset.set.split(":"); b.classList.toggle("on", state[k] === v); });
  $("#styleNote").innerHTML = STYLES[state.style].note + "　<span style='opacity:.7'>（點畫面裡的課程、標籤、搜尋都能互動；所有課程都連到同一堂示範頁）</span>";
  site.innerHTML = header() + (state.page === "home" ? home() : state.page === "lesson" ? lesson() : mapPage()) + footer();
  scroller.style.scrollBehavior = "auto";
  scroller.scrollTop = resetScroll ? 0 : top;
  scroller.style.scrollBehavior = "";
  if (state.animate) animateLogo();
  state.animate = false;
  ro.disconnect();
  const map = site.querySelector("#map");
  if (map) { requestAnimationFrame(drawMap); ro.observe(map); }
  setupSpy();
}

document.querySelector("#controls").addEventListener("click", e => {
  const b = e.target.closest("[data-set]"); if (!b) return;
  const [k, v] = b.dataset.set.split(":");
  if (k === "style") { state.style = v; state.mode = STYLES[v].mode; state.animate = true; }
  else state[k] = v;
  render(k === "page");
});
site.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); if (go.dataset.topic) state.selTopic = go.dataset.topic; state.page = go.dataset.go; render(true); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick) { state.selTopic = pick.dataset.pick; render(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { state.filter = f.dataset.filter; render(); return; }
  const toc = e.target.closest("[data-toc]");
  if (toc) { site.querySelector("#" + toc.dataset.toc).scrollIntoView({behavior: "smooth", block: "start"}); return; }
  const sc = e.target.closest("[data-scroll]");
  if (sc) { site.querySelector("#" + sc.dataset.scroll).scrollIntoView({behavior: "smooth", block: "start"}); return; }
  const lb = e.target.closest("[data-lbl]");
  if (lb) { const w = lb.closest(".fb-wrap"); w.dataset.label = lb.dataset.lbl; w.querySelectorAll("[data-lbl]").forEach(x => x.classList.toggle("on", x === lb)); return; }
  const pl = e.target.closest(".play");
  if (pl) { const a = pl.closest(".audio"); a.classList.remove("playing"); void a.offsetWidth; a.classList.add("playing"); return; }
  if (e.target.closest("[data-search]")) openSearch();
});

/* Search */
const searchEl = $("#search"), q = $("#q"), results = $("#results");
function hi(text, s) { if (!s) return text; const i = text.toLowerCase().indexOf(s.toLowerCase()); return i < 0 ? text : text.slice(0, i) + "<mark>" + text.slice(i, i + s.length) + "</mark>" + text.slice(i + s.length); }
function renderResults(s) {
  s = s.trim();
  let html = "";
  if (!s) {
    html = `<p class="res-head">最近的課程</p>` + LESSONS.slice(0, 4).map(l => `<button class="res" data-rgo="lesson"><b><span class="t">第 ${l.no} 堂</span>${l.title}</b><small>${fmtShort(l.date)} · ${l.summary}</small></button>`).join("");
  } else {
    const ls = LESSONS.filter(l => (l.title + l.summary + l.topics.map(id => T[id].name).join("")).includes(s));
    const ts = TOPICS.filter(t => (t.name + t.desc).includes(s));
    if (ts.length) html += `<p class="res-head">知識點</p>` + ts.map(t => `<button class="res" data-rgo="map" data-rtopic="${t.id}"><b><span class="t">${CATS[t.cat]}</span>${hi(t.name, s)}</b><small>${hi(t.desc, s)}</small></button>`).join("");
    if (ls.length) html += `<p class="res-head">課程</p>` + ls.map(l => `<button class="res" data-rgo="lesson"><b><span class="t">第 ${l.no} 堂</span>${hi(l.title, s)}</b><small>${fmtShort(l.date)} · ${hi(l.summary, s)}</small></button>`).join("");
    if (!html) html = `<p class="res-head">找不到「${s}」</p>`;
  }
  results.innerHTML = html;
}
function openSearch() { searchEl.hidden = false; q.value = ""; renderResults(""); setTimeout(() => q.focus(), 10); }
function closeSearch() { searchEl.hidden = true; }
q.addEventListener("input", () => renderResults(q.value));
searchEl.addEventListener("click", e => {
  const r = e.target.closest("[data-rgo]");
  if (r) { closeSearch(); if (r.dataset.rtopic) state.selTopic = r.dataset.rtopic; state.page = r.dataset.rgo; render(true); return; }
  if (e.target === searchEl) closeSearch();
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
  if (e.key === "Escape") closeSearch();
});

/* Keep the frame sized under the sticky controls */
new ResizeObserver(() => document.documentElement.style.setProperty("--ctrl-h", $("#controls").offsetHeight + "px")).observe($("#controls"));

state.mode = STYLES[state.style].mode;
document.fonts.ready.then(() => drawMap());
render();
</script>
</body>
</html>
